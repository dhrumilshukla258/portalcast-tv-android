# PortalCast TV APK, attached to a GitHub Release.
#
#   git tag v0.4.0 && git push origin v0.4.0      -> builds, signs and publishes the APK
#   Actions > Release > Run workflow               -> test build (artifact only)
#
# Signing: set these repository secrets once (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (installs fine, but every
# build has a different key, so updates need an uninstall first). Keep the keystore and
# its passwords safe and private: losing it means users must reinstall to update.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          # versionCode must grow with every release: major*10000 + minor*100 + patch.
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          [[ $CODE -lt 4 ]] && CODE=$(( 4 + GITHUB_RUN_NUMBER ))
          echo "PORTALCAST_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "PORTALCAST_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Release key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "PORTALCAST_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK will be debug-signed."
          fi

      - name: Unit tests, lint, release APK
        env:
          PORTALCAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PORTALCAST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PORTALCAST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/portalcast-tv-${PORTALCAST_VERSION_NAME}.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: portalcast-tv-apk
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portalcast-tv-apk
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
